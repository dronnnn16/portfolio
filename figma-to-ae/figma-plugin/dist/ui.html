<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 12px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text, #222);
        background: var(--figma-color-bg, #fff);
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: var(--figma-color-text-secondary, #666);
      }
      #selection {
        padding: 8px;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        color: var(--figma-color-text-onbrand, #fff);
        background: var(--figma-color-bg-brand, #0d99ff);
        cursor: pointer;
      }
      button + button {
        margin-top: 8px;
      }
      button.secondary {
        color: var(--figma-color-text, #222);
        background: var(--figma-color-bg-secondary, #eee);
      }
      button.link {
        font-weight: 400;
        color: var(--figma-color-text-secondary, #666);
        background: none;
        text-decoration: underline;
      }
      button[hidden] {
        display: none;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .status {
        margin-top: 12px;
        min-height: 32px;
        white-space: pre-wrap;
      }
      .status.error {
        color: var(--figma-color-text-danger, #d22);
      }
      .version {
        margin-top: 8px;
        font-size: 10px;
        color: var(--figma-color-text-tertiary, #999);
      }
      .status.ok {
        color: var(--figma-color-text-success, #198f51);
      }
    </style>
  </head>
  <body>
    <h1>Figma → After Effects</h1>
    <p>Select a frame and click <b>Copy for After Effects</b>. In After Effects, click the box in the FigmaToAE panel, press <b>Ctrl+V</b>, then <b>Import pasted data</b>.</p>
    <div id="selection">Select one frame to export.</div>
    <button id="copy" disabled>Copy for After Effects</button>
    <button id="retry" class="secondary" hidden>Copy to clipboard</button>
    <button id="zip" class="link" disabled>or download a ZIP instead</button>
    <div id="status" class="status"></div>
    <div class="version">v1.1.1</div>
    <script>
      "use strict";
(() => {
  // src/clipboard.ts
  var CLIPBOARD_HEADER_V1 = "FIGMA_TO_AE_CLIPBOARD 1";
  var CLIPBOARD_HEADER_V2 = "FIGMA_TO_AE_CLIPBOARD 2";
  var PASTE_BOX_SAFE_CHARS = 3e4;
  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  function base64(bytes) {
    const out = [];
    let i = 0;
    for (; i + 2 < bytes.length; i += 3) {
      const n = bytes[i] << 16 | bytes[i + 1] << 8 | bytes[i + 2];
      out.push(B64[n >> 18 & 63] + B64[n >> 12 & 63] + B64[n >> 6 & 63] + B64[n & 63]);
    }
    const rest = bytes.length - i;
    if (rest === 1) {
      const n = bytes[i] << 16;
      out.push(B64[n >> 18 & 63] + B64[n >> 12 & 63] + "==");
    } else if (rest === 2) {
      const n = bytes[i] << 16 | bytes[i + 1] << 8;
      out.push(B64[n >> 18 & 63] + B64[n >> 12 & 63] + B64[n >> 6 & 63] + "=");
    }
    return out.join("");
  }
  function asciiOnly(text) {
    return text.replace(/[\u007f-￿]/g, (c) => "\\u" + ("0000" + c.charCodeAt(0).toString(16)).slice(-4));
  }
  async function deflateRaw(data) {
    if (typeof CompressionStream === "undefined") return null;
    try {
      const stream = new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    } catch (err) {
      return null;
    }
  }
  async function buildClipboardText(frameName, sceneJson, images, options = {}) {
    const scene = asciiOnly(sceneJson);
    const compressed = options.compress === false ? null : await deflateRaw(new TextEncoder().encode(scene));
    const lines = compressed ? [CLIPBOARD_HEADER_V2, "NAME " + asciiOnly(JSON.stringify(frameName)), "SCENEZ", base64(compressed)] : [CLIPBOARD_HEADER_V1, "NAME " + asciiOnly(JSON.stringify(frameName)), "SCENE", scene];
    for (const img of images) {
      lines.push("IMAGE " + img.path, base64(img.bytes));
    }
    lines.push("END");
    return lines.join("\n");
  }

  // src/zip.ts
  var CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 3988292384 ^ c >>> 1 : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();
  function crc32(data) {
    let crc = 4294967295;
    for (let i = 0; i < data.length; i++) crc = CRC_TABLE[(crc ^ data[i]) & 255] ^ crc >>> 8;
    return (crc ^ 4294967295) >>> 0;
  }
  function utf8(text) {
    return new TextEncoder().encode(text);
  }
  function dosDateTime(date) {
    const year = Math.max(1980, date.getFullYear());
    return {
      time: date.getHours() << 11 | date.getMinutes() << 5 | Math.floor(date.getSeconds() / 2),
      date: year - 1980 << 9 | date.getMonth() + 1 << 5 | date.getDate()
    };
  }
  function createZip(entries, now = /* @__PURE__ */ new Date()) {
    const { time, date } = dosDateTime(now);
    const locals = [];
    const centrals = [];
    let offset = 0;
    for (const entry of entries) {
      const name = utf8(entry.path);
      const crc = crc32(entry.data);
      const size = entry.data.length;
      const local = new Uint8Array(30 + name.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 67324752, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 2048, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      local.set(name, 30);
      const central = new Uint8Array(46 + name.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 33639248, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 2048, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      central.set(name, 46);
      locals.push(local, entry.data);
      centrals.push(central);
      offset += local.length + size;
    }
    const centralSize = centrals.reduce((sum, c) => sum + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 101010256, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    const out = new Uint8Array(offset + centralSize + end.length);
    let pos = 0;
    for (const part of [...locals, ...centrals, end]) {
      out.set(part, pos);
      pos += part.length;
    }
    return out;
  }

  // src/ui.ts
  var copyButton = document.getElementById("copy");
  var zipButton = document.getElementById("zip");
  var retryButton = document.getElementById("retry");
  var statusEl = document.getElementById("status");
  var selectionEl = document.getElementById("selection");
  var selectionOk = false;
  var busy = false;
  var pendingCopy = "";
  function setStatus(text, kind = "info") {
    statusEl.textContent = text;
    statusEl.className = `status ${kind}`;
  }
  function refreshButtons() {
    copyButton.disabled = zipButton.disabled = busy || !selectionOk;
  }
  function zipName(frameName) {
    const base = frameName.replace(/[\\/:*?"<>|]+/g, "_").trim() || "frame";
    return `${base}-figma-ae.zip`;
  }
  function download(bytes, name) {
    const blob = new Blob([bytes], { type: "application/zip" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1e4);
  }
  function copyText(text) {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err) {
      ok = false;
    }
    area.remove();
    return ok;
  }
  var lastSize = 0;
  function copied(stats) {
    pendingCopy = "";
    retryButton.hidden = true;
    const kb = Math.max(1, Math.round(lastSize / 1024));
    let text = `Copied ${stats.nodes} layers and ${stats.images} images (${kb} KB).
In After Effects: click the box in the FigmaToAE panel, press Ctrl+V, then click "Import pasted data".`;
    if (lastSize > PASTE_BOX_SAFE_CHARS) {
      text += `
This export is large. If After Effects says the data is cut off, click "or download a ZIP instead" and use "Load Figma ZIP..." in the panel.`;
    }
    setStatus(text, "ok");
  }
  function startExport(mode) {
    busy = true;
    refreshButtons();
    retryButton.hidden = true;
    setStatus("Exporting\u2026");
    parent.postMessage({ pluginMessage: { type: "export", mode } }, "*");
  }
  copyButton.onclick = () => startExport("copy");
  zipButton.onclick = () => startExport("zip");
  var lastStats = { nodes: 0, images: 0 };
  retryButton.onclick = () => {
    if (pendingCopy && copyText(pendingCopy)) copied(lastStats);
    else setStatus('Copy failed. Use "Download ZIP" instead.', "error");
  };
  window.onmessage = async (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "selection") {
      selectionEl.textContent = msg.message;
      selectionOk = msg.ok;
      refreshButtons();
    } else if (msg.type === "progress") {
      setStatus(msg.message);
    } else if (msg.type === "error") {
      setStatus(msg.message, "error");
      busy = false;
      refreshButtons();
    } else if (msg.type === "export-result") {
      const result = msg;
      lastStats = result.stats;
      if (result.mode === "zip") {
        const pretty = JSON.stringify(JSON.parse(result.scene), null, 2);
        const entries = [{ path: "scene.json", data: utf8(pretty) }];
        for (const img of result.images) entries.push({ path: img.path, data: img.bytes });
        const name = zipName(result.fileName);
        download(createZip(entries), name);
        setStatus(`Saved ${name}: ${result.stats.nodes} nodes, ${result.stats.images} images.`, "ok");
      } else {
        const text = await buildClipboardText(result.fileName, result.scene, result.images);
        lastSize = text.length;
        if (copyText(text)) {
          copied(result.stats);
        } else {
          pendingCopy = text;
          retryButton.hidden = false;
          setStatus('Export ready. Click "Copy to clipboard" to finish.', "info");
        }
      }
      busy = false;
      refreshButtons();
    }
  };
})();

    </script>
  </body>
</html>
