<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 12px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text, #222);
        background: var(--figma-color-bg, #fff);
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: var(--figma-color-text-secondary, #666);
      }
      #selection {
        padding: 8px;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        color: var(--figma-color-text-onbrand, #fff);
        background: var(--figma-color-bg-brand, #0d99ff);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .status {
        margin-top: 12px;
        min-height: 32px;
        white-space: pre-wrap;
      }
      .status.error {
        color: var(--figma-color-text-danger, #d22);
      }
      .status.ok {
        color: var(--figma-color-text-success, #198f51);
      }
    </style>
  </head>
  <body>
    <h1>Figma → After Effects</h1>
    <p>Exports the selected frame as scene.json + @2x PNGs in one ZIP. Unzip it and run “Import Figma Export” in the After Effects panel.</p>
    <div id="selection">Select one frame to export.</div>
    <button id="export" disabled>Export</button>
    <div id="status" class="status"></div>
    <script>
      /*__UI_SCRIPT__*/
    </script>
  </body>
</html>
